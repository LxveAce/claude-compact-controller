name: test

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: node --test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version
      # Zero runtime/dev dependencies: nothing to install, just run the suite.
      - run: npm test
